<div class="page-section animate-in">
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>Date d'emprunt</th>
            <th>Date de retour</th>
            <th>Date limite</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let b of borrow">
            <td><span class="badge" style="background: var(--primary-light); color: var(--primary);">{{ b.bookId }}</span></td>
            <td>{{ b.issueDate }}</td>
            <td>{{ b.returnDate || '—' }}</td>
            <td>{{ b.dueDate }}</td>
            <td class="text-end">
              <button *ngIf="b.returnDate === null" (click)="returnBook(b.borrowId)" class="btn btn-sm btn-info">
                <i class="bi bi-box-arrow-up me-1"></i> Retourner
              </button>
              <span *ngIf="b.returnDate !== null" class="badge badge-success">Retourné</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="borrow?.length === 0" class="text-center py-5 text-muted">
      <i class="bi bi-inbox" style="font-size: 2.5rem; opacity: 0.4;"></i>
      <p class="mt-2 mb-0">Aucun emprunt en cours</p>
    </div>
  </div>
</div>
