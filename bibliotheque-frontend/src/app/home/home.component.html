<div class="hero-section">
  <div class="container">
    <div class="row align-items-center min-vh-75">
      <div class="col-lg-7 animate-in">
        <div class="hero-badge mb-3">
          <i class="bi bi-book-half me-1"></i> Système de Gestion
        </div>
        <h1 class="hero-title">Bibliothèque<br><span class="text-gradient">Management System</span></h1>
        <p class="hero-subtitle">Gérez vos livres, emprunts et utilisateurs en toute simplicité. Une interface moderne pour une expérience fluide.</p>
        <div class="d-flex gap-3 mt-4">
          <a routerLink="/books" class="btn btn-hero-primary" *ngIf="isLoggedIn()">
            <i class="bi bi-collection me-2"></i> Voir les livres
          </a>
        </div>
      </div>
      <div class="col-lg-5 d-none d-lg-block text-center animate-in" style="animation-delay: 0.2s;">
        <div class="hero-illustration">
          <i class="bi bi-book" style="font-size: 8rem; opacity: 0.15;"></i>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-5 animate-in" style="animation-delay: 0.4s;">
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(79, 70, 229, 0.1); color: #4f46e5;">
            <i class="bi bi-book"></i>
          </div>
          <div>
            <div class="stat-label">Catalogue</div>
            <div class="stat-value">Livres & Genres</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(6, 182, 212, 0.1); color: #06b6d4;">
            <i class="bi bi-arrow-left-right"></i>
          </div>
          <div>
            <div class="stat-label">Emprunts</div>
            <div class="stat-value">Suivi en temps réel</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;">
            <i class="bi bi-people"></i>
          </div>
          <div>
            <div class="stat-label">Utilisateurs</div>
            <div class="stat-value">Gestion complète</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
