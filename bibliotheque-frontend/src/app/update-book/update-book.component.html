<div class="page-section animate-in">
  <div class="form-card mx-auto">
    <div class="form-card-header">
      <div class="form-card-icon" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">
        <i class="bi bi-pencil-square"></i>
      </div>
      <div>
        <h3 class="mb-0">Modifier le livre</h3>
        <small class="text-muted">Mettez à jour les informations</small>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="form-card-body">
      <div class="form-group mb-3">
        <label class="form-label">Nom du livre</label>
        <input type="text" class="form-control" id="bookName" [(ngModel)]="book.bookName" name="bookName">
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Auteur</label>
        <input type="text" class="form-control" id="bookAuthor" [(ngModel)]="book.bookAuthor" name="bookAuthor">
      </div>

      <div class="row">
        <div class="col-md-6 form-group mb-3">
          <label class="form-label">Genre</label>
          <input type="text" class="form-control" id="bookGenre" [(ngModel)]="book.bookGenre" name="bookGenre">
        </div>
        <div class="col-md-6 form-group mb-3">
          <label class="form-label">Nombre d'exemplaires</label>
          <input type="number" class="form-control" id="noOfCopies" [(ngModel)]="book.noOfCopies" name="noOfCopies">
        </div>
      </div>

      <div class="form-actions mt-4">
        <a routerLink="/books" class="btn btn-outline-secondary me-2">
          <i class="bi bi-arrow-left me-1"></i> Annuler
        </a>
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-check-lg me-1"></i> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>
