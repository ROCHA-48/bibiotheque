<div class="page-section animate-in">
  <div class="form-card mx-auto">
    <div class="form-card-header">
      <div class="form-card-icon" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">
        <i class="bi bi-pencil-square"></i>
      </div>
      <div>
        <h3 class="mb-0">Modifier l'utilisateur</h3>
        <small class="text-muted">Mettez à jour les informations</small>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off" class="form-card-body">
      <div class="form-group mb-3">
        <label class="form-label">Nom complet</label>
        <input type="text" class="form-control" id="name" [(ngModel)]="user.name" name="name">
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Nom d'utilisateur</label>
        <input type="text" class="form-control" id="username" [(ngModel)]="user.username" name="username">
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Rôle</label>
        <select class="form-control form-select" id="role" [(ngModel)]="user.role[0].roleName" name="role">
          <option value="User">Utilisateur</option>
          <option value="Admin">Administrateur</option>
        </select>
      </div>

      <div class="form-actions mt-4">
        <a routerLink="/users" class="btn btn-outline-secondary me-2">
          <i class="bi bi-arrow-left me-1"></i> Annuler
        </a>
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-check-lg me-1"></i> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>
