<div class="modal-overlay" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="confirm-modal">
    <div class="confirm-icon" [ngClass]="'icon-' + (data?.type || 'info')">
      <i class="bi" [ngClass]="getIcon()"></i>
    </div>
    <h3 class="confirm-title">{{ data?.title }}</h3>
    <p class="confirm-message">{{ data?.message }}</p>
    <div class="confirm-actions">
      <button class="btn btn-cancel" (click)="onCancel()">
        {{ data?.cancelText || 'Annuler' }}
      </button>
      <button class="btn" [ngClass]="'btn-' + (data?.type || 'info')" (click)="onConfirm()">
        {{ data?.confirmText || 'Confirmer' }}
      </button>
    </div>
  </div>
</div>
