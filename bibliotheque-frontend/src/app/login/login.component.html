<div class="login-wrapper animate-in">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">
        <i class="bi bi-book-half"></i>
      </div>
      <h2 class="login-title">Bienvenue</h2>
      <p class="login-subtitle">Connectez-vous à votre compte</p>
    </div>

    <form autocomplete="off" #loginForm="ngForm" (ngSubmit)="login(loginForm)" class="login-form">
      <div class="form-group mb-3">
        <label class="form-label">
          <i class="bi bi-person me-1"></i> Nom d'utilisateur
        </label>
        <input type="text" name="username" ngModel class="form-control" placeholder="Entrez votre identifiant">
      </div>

      <div class="form-group mb-4">
        <label class="form-label">
          <i class="bi bi-lock me-1"></i> Mot de passe
        </label>
        <input type="password" name="password" ngModel class="form-control" placeholder="Entrez votre mot de passe">
      </div>

      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i> Se connecter
      </button>
    </form>

    <div class="login-footer">
      <small class="text-muted">Identifiants fournis par l'administrateur</small>
    </div>
  </div>
</div>
