<div class="modal-overlay" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="form-modal">
    <div class="modal-header-custom">
      <div class="modal-icon" style="background: rgba(6, 182, 212, 0.1); color: #06b6d4;">
        <i class="bi bi-person-plus"></i>
      </div>
      <h2>Ajouter un utilisateur</h2>
      <p>Créer un nouveau compte</p>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Nom complet</label>
        <input type="text" class="form-control" id="name" [(ngModel)]="user.name" name="name" placeholder="Ex: Marie Dupont">
      </div>

      <div class="form-group">
        <label class="form-label">Nom d'utilisateur</label>
        <input type="text" class="form-control" id="username" [(ngModel)]="user.username" name="username" placeholder="Ex: marie.dupont">
      </div>

      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" class="form-control" id="password" [(ngModel)]="user.password" name="password" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label class="form-label">Rôle</label>
        <select class="form-control form-select" id="role" [(ngModel)]="user.role[0].roleName" name="role">
          <option value="User">Utilisateur</option>
          <option value="Admin">Administrateur</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" (click)="close()">
          <i class="bi bi-arrow-left me-1"></i> Annuler
        </button>
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-check-lg me-1"></i> Enregistrer
        </button>
      </div>
    </form>

    <button class="modal-close-btn" (click)="close()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
</div>
