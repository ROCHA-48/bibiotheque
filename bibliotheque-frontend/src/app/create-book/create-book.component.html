<div class="page-section animate-in">
  <div class="form-card mx-auto">
    <div class="form-card-header">
      <div class="form-card-icon" style="background: rgba(79, 70, 229, 0.1); color: #4f46e5;">
        <i class="bi bi-plus-circle"></i>
      </div>
      <div>
        <h3 class="mb-0">Ajouter un livre</h3>
        <small class="text-muted">Remplissez les informations du livre</small>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off" class="form-card-body">
      <div class="form-group mb-3">
        <label class="form-label">Nom du livre</label>
        <input type="text" class="form-control" id="bookName" [(ngModel)]="book.bookName" name="bookName" placeholder="Ex: Le Petit Prince">
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Auteur</label>
        <input type="text" class="form-control" id="bookAuthor" [(ngModel)]="book.bookAuthor" name="bookAuthor" placeholder="Ex: Antoine de Saint-Exupéry">
      </div>

      <div class="row">
        <div class="col-md-6 form-group mb-3">
          <label class="form-label">Genre</label>
          <input type="text" class="form-control" id="bookGenre" [(ngModel)]="book.bookGenre" name="bookGenre" placeholder="Ex: Conte">
        </div>
        <div class="col-md-6 form-group mb-3">
          <label class="form-label">Nombre d'exemplaires</label>
          <input type="number" class="form-control" id="noOfCopies" [(ngModel)]="book.noOfCopies" name="noOfCopies" placeholder="5">
        </div>
      </div>

      <div class="form-actions mt-4">
        <a routerLink="/books" class="btn btn-outline-secondary me-2">
          <i class="bi bi-arrow-left me-1"></i> Annuler
        </a>
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-check-lg me-1"></i> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>
