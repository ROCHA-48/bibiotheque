server.port=${SERVER_PORT:8080}

# Base de données — surchargée par les variables d'environnement Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bibliotheque}
spring.datasource.username=${DB_USER:bibliotheque}
spring.datasource.password=${DB_PASSWORD:mysql}

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
hibernate.format_sql=true;

# Secret JWT — externalisé (obligatoire de le changer en production)
jwt.secret=${JWT_SECRET:learn_programming_yourself}
